[project]
name = "dota-draft-mcp"
version = "0.1.0"
description = "Local MCP server that helps draft in Dota 2 using OpenDota data from Divine and Immortal matches"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.scripts]
dota-draft-server = "dota_draft.server:main"
dota-draft-collect = "dota_draft.collect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dota_draft"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
